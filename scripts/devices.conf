# ==============================================================================
# Device registry — one line per device
# ==============================================================================
# Format: device|serial|codename|platform|product|has_recovery|has_super|nfs_version|hostname
#
#   device:       Human name used in build.sh/setup.sh (e.g. oneplus7pro)
#   serial:       adb/fastboot serial number
#   codename:     LineageOS codename (for lineageos/ directory)
#   platform:     SoC directory under kernel/ (e.g. sm8150)
#   product:      fastboot product string for verification
#   has_recovery: true if device has separate recovery partition (SM8250+)
#   has_super:    true if device uses dynamic partitions (SM8250+)
#   nfs_version:  NFS version to use (3 or 4; use 3 for kernel < 4.19)
#   hostname:     Network hostname for the device

oneplus7pro|2e2e5cbf|guacamole|sm8150|msmnile|false|false|3|hr-op7
oneplus8pro|8e1cdcbe|instantnoodlep|sm8250|kona|true|true|3|hr-op8
