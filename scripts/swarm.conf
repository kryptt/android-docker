# ==============================================================================
# Docker Swarm cluster configuration
# ==============================================================================
# Shared by all device boot scripts and host-side deploy/flash scripts.
#
# Secrets (NFS_SERVER, SWARM_TOKEN, SWARM_MANAGER, NFS_MOUNTS) are read
# from .envrc (host-side) or /data/docker/swarm.env (on-device).
# This file only contains non-secret defaults.

# --- Timeouts ----------------------------------------------------------------
WIFI_WAIT_MAX="${WIFI_WAIT_MAX:-120}"
DOCKER_STARTUP_MAX="${DOCKER_STARTUP_MAX:-60}"

# --- Docker paths (on device) ------------------------------------------------
DOCKER_BIN="${DOCKER_BIN:-/data/docker/bin}"
DOCKER_DATA="${DOCKER_DATA:-/data/docker/lib}"
DOCKER_RUN="${DOCKER_RUN:-/data/docker/run}"

# --- Load secrets from swarm.env (on-device) ---------------------------------
SWARM_ENV="/data/docker/swarm.env"
if [ -f "$SWARM_ENV" ]; then
    . "$SWARM_ENV"
fi

# --- Validate required variables ---------------------------------------------
if [ -z "${NFS_SERVER:-}" ] || [ -z "${SWARM_TOKEN:-}" ] || [ -z "${SWARM_MANAGER:-}" ]; then
    echo "ERROR: NFS_SERVER, SWARM_TOKEN, and SWARM_MANAGER must be set" >&2
    echo "       On device: /data/docker/swarm.env" >&2
    echo "       On host:   .envrc" >&2
fi
